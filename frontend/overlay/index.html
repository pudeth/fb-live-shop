<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OBS Overlay</title>
  <!-- QR code styling library (MIT licensed, runs 100% locally) -->
  <script src="/public/qr-code-styling.js"></script>
  <style>
    /* ── Base: transparent canvas for OBS Studio & desktop streaming ── */
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      color-scheme: dark;
    }
    html, body {
      width: 100%;
      height: 100%;
      min-width: 100vw;
      min-height: 100vh;
      background: transparent !important;
      background-color: transparent !important;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    /* ════════════════════════════════════════
       DESKTOP FLOATING CONTROLS TOOLBAR
       (Visible only on hover or in desktop mode)
       ════════════════════════════════════════ */
    #desktop-toolbar {
      position: fixed;
      top: 14px;
      right: 20px;
      z-index: 999999;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(16px);
      padding: 6px 12px;
      border-radius: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      transition: opacity 0.3s ease, transform 0.3s ease;
      opacity: 0.85;
    }
    #desktop-toolbar:hover {
      opacity: 1;
      transform: translateY(0);
      background: rgba(15, 23, 42, 0.96);
    }
    .drag-handle {
      -webkit-app-region: drag;
      cursor: grab;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
      padding-right: 6px;
      border-right: 1px solid rgba(255, 255, 255, 0.12);
    }
    .toolbar-btn {
      -webkit-app-region: no-drag;
      border: none;
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      padding: 5px 10px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .toolbar-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }
    .toolbar-btn.active {
      background: #6366f1;
      color: #fff;
    }
    .toolbar-btn.btn-close:hover {
      background: #ef4444;
      color: #fff;
    }


    /* ════════════════════════════════════════
       PRODUCT CARD  (bottom-left)
       ════════════════════════════════════════ */
    #product-card {
      position: absolute;
      bottom: 40px;
      left: 40px;
      width: 420px;
      max-width: calc(100vw - 280px);
      background: rgba(8, 10, 20, 0.93);
      border: 1.5px solid rgba(255,255,255,.13);
      border-radius: 22px;
      padding: 22px 20px 20px;
      display: flex;
      gap: 18px;
      align-items: flex-start;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.04);
      opacity: 0;
      transform: translateY(24px);
      transition: opacity .45s cubic-bezier(.22,1,.36,1), transform .45s cubic-bezier(.22,1,.36,1);
      pointer-events: none;
    }
    #product-card.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }

    /* product image */
    .card-img {
      width: 106px; height: 106px;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(255,255,255,.07);
      display: flex; align-items: center; justify-content: center;
      font-size: 40px;
      flex-shrink: 0;
    }
    .card-img img { width:100%; height:100%; object-fit:cover; }

    /* text block */
    .card-info { flex:1; min-width:0; }

    .on-air-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #e53935;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .09em;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 9px;
      text-transform: uppercase;
    }
    .on-air-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #fff;
      animation: blink 1s ease infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.15} }

    .prod-code     { font-size:11px; font-family:monospace; color:#60a5fa; font-weight:700; letter-spacing:.08em; margin-bottom:5px; }
    .prod-name     { font-size:19px; font-weight:900; color:#fff; line-height:1.2; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .prod-category { font-size:11px; color:rgba(255,255,255,.4); margin-bottom:9px; }
    .prod-price    { font-size:28px; font-weight:900; color:#4ade80; letter-spacing:-.5px; line-height:1; }
    .prod-stock    { font-size:11px; color:rgba(255,255,255,.38); margin-top:4px; }

    .prod-options  { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
    .opt-chip {
      background: rgba(255,255,255,.1);
      color: rgba(255,255,255,.72);
      font-size: 10px; font-weight:600;
      padding: 2px 8px; border-radius: 20px;
    }

    /* ════════════════════════════════════════
       QR CODE WIDGET  (bottom-left, right of product card)
       ════════════════════════════════════════ */
    #qr-widget {
      position: absolute;
      bottom: 40px;
      left: 480px;          /* 40 + 420 + 20 gap */
      width: 200px;
      background: rgba(8, 10, 20, 0.93);
      border: 1.5px solid rgba(255,255,255,.13);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px rgba(0,0,0,.7);
      opacity: 0;
      transform: translateY(24px);
      transition: opacity .45s cubic-bezier(.22,1,.36,1) .08s, transform .45s cubic-bezier(.22,1,.36,1) .08s;
      pointer-events: none;
    }
    #qr-widget.visible { opacity:1; transform:translateY(0); pointer-events: auto; }

    .qr-label-top {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .1em;
      color: rgba(255,255,255,.5);
      text-transform: uppercase;
    }

    /* white QR background so scanner can read it */
    #qr-canvas-wrap {
      background: #fff;
      border-radius: 12px;
      padding: 8px;
      width: 150px; height: 150px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    #qr-canvas-wrap canvas,
    #qr-canvas-wrap img { width:134px !important; height:134px !important; }

    .qr-label-bottom {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,.55);
      text-align: center;
      line-height: 1.4;
    }
    .qr-scan-hint {
      font-size: 13px;
      font-weight: 800;
      color: #4ade80;
      text-align: center;
      letter-spacing: .03em;
    }

    /* small product code pill under QR */
    .qr-code-pill {
      background: rgba(96,165,250,.15);
      border: 1px solid rgba(96,165,250,.35);
      color: #60a5fa;
      font-size: 12px;
      font-weight: 800;
      font-family: monospace;
      letter-spacing: .1em;
      padding: 4px 12px;
      border-radius: 20px;
    }

    /* ════════════════════════════════════════
       CAPTION BAR  (bottom strip)
       ════════════════════════════════════════ */
    #caption-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 14px 60px;
      display: flex; align-items: center; gap: 14px;
      opacity: 0; transform: translateY(10px);
      transition: opacity .35s ease, transform .35s ease;
      pointer-events: none;
    }
    #caption-bar.visible { opacity:1; transform:translateY(0); }
    #caption-bar.style-default { background: linear-gradient(90deg, rgba(8,10,20,.96), rgba(8,10,20,.84) 80%, transparent); }
    #caption-bar.style-alert   { background: linear-gradient(90deg, rgba(197,42,42,.96), rgba(197,42,42,.84) 80%, transparent); }
    #caption-bar.style-promo   { background: linear-gradient(90deg, rgba(146,64,14,.96), rgba(146,64,14,.84) 80%, transparent); }
    #caption-bar.style-info    { background: linear-gradient(90deg, rgba(29,78,216,.96), rgba(29,78,216,.84) 80%, transparent); }
    .caption-icon { font-size:20px; flex-shrink:0; }
    .caption-text { font-size:19px; font-weight:700; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.6); flex:1; }

    /* ════════════════════════════════════════
       ORDER NOTIFICATION  (top-right)
       ════════════════════════════════════════ */
    #order-notif {
      position: absolute;
      top: 60px; right: 60px;
      width: 330px;
      background: rgba(8,10,20,.93);
      border: 1.5px solid rgba(74,222,128,.3);
      border-left: 4px solid #4ade80;
      border-radius: 18px;
      padding: 16px 20px;
      display: flex; gap: 12px; align-items: flex-start;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0,0,0,.55);
      opacity: 0; transform: translateX(24px);
      transition: opacity .35s ease, transform .35s ease;
      pointer-events: none;
    }
    #order-notif.visible { opacity:1; transform:translateX(0); }
    .notif-icon  { font-size:30px; }
    .notif-label { font-size:10px; font-weight:800; color:#4ade80; text-transform:uppercase; letter-spacing:.08em; margin-bottom:3px; }
    .notif-customer { font-size:16px; font-weight:800; color:#fff; }
    .notif-product  { font-size:13px; color:rgba(255,255,255,.55); margin-top:2px; }
    .notif-total { font-size:18px; font-weight:900; color:#4ade80; margin-top:6px; letter-spacing:-.5px; }

    /* ════════════════════════════════════════
       ORDER TRACKING SLIDE  (centered, appears on new order)
       ════════════════════════════════════════ */
    #order-tracking-slide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      width: 500px;
      max-width: 90vw;
      background: linear-gradient(135deg, rgba(16, 20, 36, 0.97), rgba(8, 10, 20, 0.97));
      border: 2px solid rgba(74,222,128,.4);
      border-radius: 24px;
      padding: 32px 36px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 80px rgba(0,0,0,.8), 0 0 0 1px rgba(74,222,128,.2);
      opacity: 0;
      transition: opacity .45s cubic-bezier(.22,1,.36,1), transform .45s cubic-bezier(.22,1,.36,1);
      pointer-events: none;
      z-index: 10000;
    }
    #order-tracking-slide.visible { 
      opacity: 1; 
      transform: translate(-50%, -50%) scale(1); 
      pointer-events: auto; 
    }

    .slide-header {
      text-align: center;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(255,255,255,.1);
      padding-bottom: 16px;
    }
    .slide-icon {
      font-size: 52px;
      margin-bottom: 8px;
      animation: bounce 0.6s ease;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .slide-title {
      font-size: 24px;
      font-weight: 900;
      color: #4ade80;
      margin-bottom: 4px;
      letter-spacing: -.5px;
    }
    .slide-subtitle {
      font-size: 13px;
      color: rgba(255,255,255,.5);
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 700;
    }

    .slide-content {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .slide-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,.05);
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.08);
    }
    .slide-row-icon {
      font-size: 26px;
      flex-shrink: 0;
    }
    .slide-row-content {
      flex: 1;
      min-width: 0;
    }
    .slide-row-label {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,.5);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 4px;
    }
    .slide-row-value {
      font-size: 17px;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .slide-row.total-row {
      background: rgba(74,222,128,.12);
      border: 1.5px solid rgba(74,222,128,.3);
    }
    .slide-row.total-row .slide-row-value {
      font-size: 26px;
      color: #4ade80;
      letter-spacing: -.5px;
    }

    /* ════════════════════════════════════════
       LIVE BADGE  (top-left)
       ════════════════════════════════════════ */
    #live-badge {
      position: absolute;
      top: 40px; left: 40px;
      background: #e53935;
      color: #fff;
      font-size: 13px; font-weight: 800;
      padding: 6px 18px;
      border-radius: 20px;
      letter-spacing: .09em; text-transform: uppercase;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 18px rgba(229,57,53,.45);
      opacity: 0; transition: opacity .35s;
      pointer-events: none;
    }
    #live-badge.visible { opacity:1; }
    #live-badge.paused  { background: #e65100; }
    .badge-dot {
      width:8px; height:8px; border-radius:50%; background:#fff;
      animation: blink 1s ease infinite;
    }


  </style>
</head>
<body>

  <!-- Floating Desktop Toolbar (Visible on Desktop / Electron) -->
  <div id="desktop-toolbar" style="display:none">
    <div class="drag-handle" title="Drag to move overlay">
      <span>⠿</span> FB Live Overlay
    </div>
    <button class="toolbar-btn" id="btn-test-product" onclick="toggleTestProduct()" title="Preview sample product & QR code">
      👁️ Test Product
    </button>
    <button class="toolbar-btn active" id="btn-pin" onclick="toggleAlwaysOnTop()" title="Pin Always on Top">
      📌 Pinned
    </button>
    <button class="toolbar-btn" onclick="location.reload()" title="Reload overlay">
      🔄
    </button>
    <button class="toolbar-btn btn-close" onclick="closeOverlayWindow()" title="Close Transparent Overlay Window">
      ✕
    </button>
  </div>

  <!-- Live badge -->
  <div id="live-badge">
    <span class="badge-dot"></span>
    <span id="live-badge-text">LIVE</span>
  </div>

  <!-- ── Product card (bottom-left) ── -->
  <div id="product-card">
    <div class="card-img">
      <img id="prod-img" src="" alt="" style="display:none" />
      <span id="prod-img-placeholder">📦</span>
    </div>
    <div class="card-info">
      <div class="on-air-pill"><span class="on-air-dot"></span> ON AIR</div>
      <div class="prod-code"     id="prod-code"></div>
      <div class="prod-name"     id="prod-name"></div>
      <div class="prod-category" id="prod-category"></div>
      <div class="prod-price"    id="prod-price"></div>
      <div class="prod-stock"    id="prod-stock"></div>
      <div class="prod-options"  id="prod-options"></div>
    </div>
  </div>

  <!-- ── QR widget (bottom, right of product card) ── -->
  <div id="qr-widget">
    <div class="qr-label-top">📸 Screenshot &amp; Order</div>
    <div id="qr-canvas-wrap"></div>
    <div class="qr-code-pill" id="qr-code-pill">P01</div>
    <div class="qr-scan-hint">📱 Scan to Buy</div>
    <div class="qr-label-bottom">Screenshot this QR code<br/>to view &amp; order instantly</div>
  </div>

  <!-- ── Caption bar (bottom) ── -->
  <div id="caption-bar" class="style-default">
    <span class="caption-icon" id="caption-icon">📢</span>
    <span class="caption-text" id="caption-text"></span>
  </div>

  <!-- ── Order notification (top-right) ── -->
  <div id="order-notif">
    <div class="notif-icon">🎉</div>
    <div class="notif-info">
      <div class="notif-label">New Order!</div>
      <div class="notif-customer" id="notif-customer"></div>
      <div class="notif-product"  id="notif-product"></div>
      <div class="notif-total" id="notif-total"></div>
    </div>
  </div>

  <!-- ── Order Tracking Slide (centered, full details) ── -->
  <div id="order-tracking-slide">
    <div class="slide-header">
      <div class="slide-icon">🎉</div>
      <div class="slide-title">New Order Received!</div>
      <div class="slide-subtitle">Live Order Confirmed</div>
    </div>
    <div class="slide-content">
      <div class="slide-row">
        <div class="slide-row-icon">👤</div>
        <div class="slide-row-content">
          <div class="slide-row-label">Customer Name</div>
          <div class="slide-row-value" id="slide-customer-name">-</div>
        </div>
      </div>
      <div class="slide-row">
        <div class="slide-row-icon">📦</div>
        <div class="slide-row-content">
          <div class="slide-row-label">Product</div>
          <div class="slide-row-value" id="slide-product-name">-</div>
        </div>
      </div>
      <div class="slide-row total-row">
        <div class="slide-row-icon">💰</div>
        <div class="slide-row-content">
          <div class="slide-row-label">Total Price</div>
          <div class="slide-row-value" id="slide-total-price">$0.00</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Socket.IO -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const productCard = document.getElementById('product-card');
    const qrWidget    = document.getElementById('qr-widget');
    const captionBar  = document.getElementById('caption-bar');
    const liveBadge   = document.getElementById('live-badge');
    const orderNotif  = document.getElementById('order-notif');
    const orderTrackingSlide = document.getElementById('order-tracking-slide');
    let orderNotifTimer = null;
    let orderSlideTimer = null;
    let isTestMode = false;
    let isAlwaysOnTop = true;

    // Detect if running in Electron desktop window
    const isElectron = !!(window.electronAPI || window.location.search.includes('mode=desktop'));
    if (isElectron) {
      document.getElementById('desktop-toolbar').style.display = 'flex';
    }

    // ── Helpers ──
    function showEl(el) { el.classList.add('visible'); }
    function hideEl(el) { el.classList.remove('visible'); }
    function fmtPrice(v) { 
      const num = typeof v === 'number' ? v : (parseFloat(String(v || '0').replace(/[^0-9.-]/g, '')) || 0);
      return '$' + num.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' / ៛' + Math.round(num * 4100).toLocaleString('en-US'); 
    }

    // ── Window Controls ──
    function closeOverlayWindow() {
      if (window.electronAPI && window.electronAPI.closeOverlayWindow) {
        window.electronAPI.closeOverlayWindow();
      } else {
        window.close();
      }
    }

    async function toggleAlwaysOnTop() {
      isAlwaysOnTop = !isAlwaysOnTop;
      const btn = document.getElementById('btn-pin');
      if (window.electronAPI && window.electronAPI.setOverlayAlwaysOnTop) {
        await window.electronAPI.setOverlayAlwaysOnTop(isAlwaysOnTop);
      }
      if (isAlwaysOnTop) {
        btn.classList.add('active');
        btn.innerHTML = '📌 Pinned';
      } else {
        btn.classList.remove('active');
        btn.innerHTML = '📌 Unpinned';
      }
    }

    function toggleTestProduct() {
      isTestMode = !isTestMode;
      const btn = document.getElementById('btn-test-product');
      if (isTestMode) {
        if (btn) {
          btn.classList.add('active');
          btn.innerHTML = '✕ Hide Sample';
        }
        renderProduct({
          product_code: 'P01',
          name: 'Classic White T-Shirt',
          category_name: 'Clothing',
          price: 12.00,
          stock: 50,
          options: { colors: ['White', 'Black'], sizes: ['M', 'L', 'XL'] }
        });
        showEl(productCard);
        showEl(qrWidget);
        showEl(liveBadge);
      } else {
        if (btn) {
          btn.classList.remove('active');
          btn.innerHTML = '👁️ Test Product';
        }
        hideEl(productCard);
        hideEl(qrWidget);
        hideEl(liveBadge);
      }
    }

    // ── QR generation ──
    function generateQR(url, productCode) {
      const wrap = document.getElementById('qr-canvas-wrap');
      wrap.innerHTML = '';
      document.getElementById('qr-code-pill').textContent = productCode;

      const qrCode = new QRCodeStyling({
        width:  134,
        height: 134,
        type:   'canvas',
        data:   url,
        dotsOptions: {
          color: '#0a0a0a',
          type:  'rounded',
        },
        cornersSquareOptions: {
          type:  'extra-rounded',
          color: '#0a0a0a',
        },
        cornersDotOptions: {
          type:  'dot',
          color: '#0a0a0a',
        },
        backgroundOptions: {
          color: '#ffffff',
        },
        qrOptions: {
          errorCorrectionLevel: 'M',
        },
      });
      qrCode.append(wrap);
    }

    // ── Socket ──
    const socket = io(window.location.origin, { transports: ['websocket','polling'] });
    let qrBaseUrl = window.location.origin;

    async function refreshQrBaseUrl() {
      try {
        const d = await fetch('/api/server-info').then(r => r.json());
        if (d.baseUrl) qrBaseUrl = d.baseUrl;
      } catch { /* keep last known value */ }
    }

    refreshQrBaseUrl();

    socket.on('connect', () => {
      socket.emit('join-live');
      loadInitialState();
    });

    socket.on('product-shown', async ({ product }) => {
      isTestMode = false;
      const btn = document.getElementById('btn-test-product');
      if (btn) { btn.classList.remove('active'); btn.innerHTML = '👁️ Test Product'; }

      await refreshQrBaseUrl();
      renderProduct(product);
      showEl(productCard);
      showEl(qrWidget);
      showEl(liveBadge);
    });

    socket.on('product-hidden', () => {
      hideEl(productCard);
      hideEl(qrWidget);
    });

    socket.on('qr-config-updated', async ({ baseUrl }) => {
      if (baseUrl) qrBaseUrl = baseUrl;
      if (productCard.dataset.hasProduct === 'true') {
        const code = document.getElementById('prod-code').textContent;
        if (code) {
          const url = `${qrBaseUrl}/customer/product.html?code=${encodeURIComponent(code)}`;
          generateQR(url, code);
        }
      }
    });

    socket.on('caption-shown', ({ text, style }) => {
      document.getElementById('caption-text').textContent = text;
      const icons = { default:'📢', alert:'🚨', promo:'🏷️', info:'ℹ️' };
      document.getElementById('caption-icon').textContent = icons[style] || '📢';
      captionBar.className = `style-${style || 'default'}`;
      showEl(captionBar);
    });
    socket.on('caption-hidden', () => hideEl(captionBar));

    socket.on('overlay-show', () => {
      if (productCard.dataset.hasProduct === 'true') {
        showEl(productCard);
        showEl(qrWidget);
      }
      showEl(liveBadge);
    });
    socket.on('overlay-hide', () => {
      hideEl(productCard);
      hideEl(qrWidget);
      hideEl(captionBar);
    });

    socket.on('live-status-updated', ({ status }) => {
      const txt = document.getElementById('live-badge-text');
      if (status === 'active') {
        txt.textContent = 'LIVE';
        liveBadge.classList.remove('paused');
        showEl(liveBadge);
      } else if (status === 'paused') {
        txt.textContent = 'PAUSED';
        liveBadge.classList.add('paused');
        showEl(liveBadge);
      } else {
        hideEl(liveBadge);
        hideEl(productCard);
        hideEl(qrWidget);
        hideEl(captionBar);
      }
    });

    socket.on('order-notification', (data) => {
      const customerName = data.customer_name || 'A customer';
      const productName = data.product_name || 'an item';
      const totalAmount = data.total_amount || 0;
      
      // Update small notification (top-right)
      document.getElementById('notif-customer').textContent = customerName;
      document.getElementById('notif-product').textContent = `ordered: ${productName}`;
      document.getElementById('notif-total').textContent = fmtPrice(totalAmount);
      showEl(orderNotif);
      clearTimeout(orderNotifTimer);
      orderNotifTimer = setTimeout(() => hideEl(orderNotif), 6000);

      // Update and show large tracking slide (centered)
      document.getElementById('slide-customer-name').textContent = customerName;
      document.getElementById('slide-product-name').textContent = productName;
      document.getElementById('slide-total-price').textContent = fmtPrice(totalAmount);
      showEl(orderTrackingSlide);
      clearTimeout(orderSlideTimer);
      orderSlideTimer = setTimeout(() => hideEl(orderTrackingSlide), 8000);
    });

    // ── Render product + QR ──
    function renderProduct(p) {
      productCard.dataset.hasProduct = 'true';

      document.getElementById('prod-code').textContent     = p.product_code    || '';
      document.getElementById('prod-name').textContent     = p.name            || '';
      document.getElementById('prod-category').textContent = p.category_name   || '';
      document.getElementById('prod-price').textContent    = fmtPrice(p.price);
      document.getElementById('prod-stock').textContent    = p.stock != null ? `Stock: ${p.stock}` : '';

      // Image
      const img = document.getElementById('prod-img');
      const ph  = document.getElementById('prod-img-placeholder');
      if (p.image) {
        img.src = (p.image.startsWith('http') || p.image.startsWith('data:')) ? p.image : window.location.origin + (p.image.startsWith('/') ? p.image : '/' + p.image);
        img.style.display = 'block';
        ph.style.display  = 'none';
        img.onerror = () => { img.style.display='none'; ph.style.display='block'; };
      } else {
        img.style.display = 'none';
        ph.style.display  = 'block';
      }

      // Options chips
      const optEl = document.getElementById('prod-options');
      optEl.innerHTML = '';
      if (p.options && typeof p.options === 'object') {
        Object.entries(p.options).forEach(([, vals]) => {
          const values = Array.isArray(vals) ? vals : [vals];
          values.slice(0, 5).forEach(v => {
            const chip = document.createElement('span');
            chip.className   = 'opt-chip';
            chip.textContent = v;
            optEl.appendChild(chip);
          });
        });
      }

      const customerUrl = `${qrBaseUrl}/customer/product.html?code=${encodeURIComponent(p.product_code)}`;
      generateQR(customerUrl, p.product_code);
    }

    // ── Load state on connect ──
    async function loadInitialState() {
      try {
        await refreshQrBaseUrl();
        const liveRes  = await fetch('/api/live/active');
        const liveData = await liveRes.json();
        if (!liveData?.data) return;
        showEl(liveBadge);
        const prodRes  = await fetch('/api/live/current-product');
        const prodData = await prodRes.json();
        if (prodData?.data) {
          renderProduct(prodData.data);
          showEl(productCard);
          showEl(qrWidget);
        }
      } catch { /* silent */ }
    }
  </script>
</body>
</html>
