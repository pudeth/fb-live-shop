<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/variables.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">📺</div>
      <div class="logo-text">FB Live<br /><span>Product System</span></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-title">Main</div>
      <a class="nav-item" href="/admin/dashboard.html"><span class="nav-icon">📊</span><span class="nav-label">Dashboard</span></a>
      <a class="nav-item" href="/admin/products.html"><span class="nav-icon">📦</span><span class="nav-label">Products</span></a>
      <a class="nav-item" href="/admin/categories.html"><span class="nav-icon">🏷️</span><span class="nav-label">Categories</span></a>
      <a class="nav-item active" href="/admin/orders.html"><span class="nav-icon">🛒</span><span class="nav-label">Orders</span></a>
      <div class="nav-section-title" style="margin-top:8px">Management</div>
      <a class="nav-item" href="/admin/users.html"><span class="nav-icon">👥</span><span class="nav-label">Users</span></a>
      <div class="nav-section-title" style="margin-top:8px">Live</div>
      <a class="nav-item" href="/cashier/live.html"><span class="nav-icon">🔴</span><span class="nav-label">Live Control</span></a>
      <a class="nav-item" href="/overlay/index.html" target="_blank"><span class="nav-icon">🖥️</span><span class="nav-label">OBS Overlay</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar" id="user-avatar">A</div>
        <div class="user-info">
          <div class="user-name" id="user-name">Admin</div>
          <div class="user-role">admin</div>
        </div>
        <button class="user-logout-btn" onclick="logout()">🚪</button>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">Orders</div>
      <div class="topbar-actions">
        <span id="order-count" style="font-size:13px;color:var(--gray-500)"></span>
      </div>
    </header>

    <div class="page-content">
      <div class="card">
        <div class="card-header">
          <div class="filter-bar" style="flex:1;margin-bottom:0;flex-wrap:wrap">
            <div class="search-input-wrapper" style="min-width:180px">
              <span class="search-icon">🔍</span>
              <input class="form-control" type="text" id="search-input" placeholder="Order #, customer, phone…" oninput="debounceLoad()" />
            </div>
            <select class="form-control" id="filter-status" onchange="loadOrders()" style="width:150px">
              <option value="">All Status</option>
              <option value="pending">Pending</option>
              <option value="confirmed">Confirmed</option>
              <option value="processing">Processing</option>
              <option value="shipped">Shipped</option>
              <option value="delivered">Delivered</option>
              <option value="cancelled">Cancelled</option>
            </select>
            <select class="form-control" id="filter-payment" onchange="loadOrders()" style="width:150px">
              <option value="">All Payments</option>
              <option value="paid">Paid</option>
              <option value="unpaid">Unpaid</option>
              <option value="partial">Partial</option>
            </select>
          </div>
        </div>
        <div class="table-wrapper">
          <table class="table">
            <thead><tr>
              <th>Order #</th><th>Customer</th><th>Phone</th><th>Total</th>
              <th>Payment</th><th>Status</th><th>Date</th><th style="width:80px">Actions</th>
            </tr></thead>
            <tbody id="orders-body">
              <tr><td colspan="8" style="text-align:center;padding:40px"><div class="spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Order Detail Modal -->
<div class="modal-backdrop" id="order-modal">
  <div class="modal modal-xl">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="order-modal-title">Order Detail</div>
        <div style="font-size:13px;color:var(--gray-500)" id="order-modal-sub"></div>
      </div>
      <button class="modal-close" onclick="closeModal('order-modal')">✕</button>
    </div>
    <div class="modal-body" id="order-modal-body">Loading…</div>
    <div class="modal-footer" id="order-modal-footer"></div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/assets/js/api.js"></script>
<script>
  if (!auth.requireAuth(['admin'])) {}
  const user = auth.getUser();
  if (user) {
    document.getElementById('user-name').textContent = user.full_name || user.username;
    document.getElementById('user-avatar').textContent = (user.full_name || user.username)[0].toUpperCase();
  }
  function logout() { auth.clear(); window.location.href = '/login.html'; }

  let searchTimer = null;
  function debounceLoad() { clearTimeout(searchTimer); searchTimer = setTimeout(loadOrders, 400); }

  async function loadOrders() {
    const search  = document.getElementById('search-input').value.trim();
    const status  = document.getElementById('filter-status').value;
    const payment = document.getElementById('filter-payment').value;
    let params = '?';
    if (search)  params += `search=${encodeURIComponent(search)}&`;
    if (status)  params += `status=${status}&`;
    if (payment) params += `payment_status=${payment}&`;

    const res = await api.getOrders(params);
    const orders = res?.data || [];
    document.getElementById('order-count').textContent = `${orders.length} order${orders.length !== 1 ? 's' : ''}`;

    const body = document.getElementById('orders-body');
    if (orders.length === 0) {
      body.innerHTML = `<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">🛒</div><h3>No orders found</h3></div></td></tr>`;
      return;
    }
    body.innerHTML = orders.map(o => `<tr>
      <td><span class="code" style="font-size:11px">${o.order_number}</span></td>
      <td><strong>${o.customer_name}</strong></td>
      <td style="font-size:13px">${o.customer_phone}</td>
      <td style="font-weight:700">${fmt.currency(o.total_amount)}</td>
      <td>${fmt.statusBadge(o.payment_status)}</td>
      <td>${fmt.statusBadge(o.status)}</td>
      <td style="font-size:13px;color:var(--gray-500)">${fmt.datetime(o.created_at)}</td>
      <td><button class="btn btn-outline btn-sm" onclick="viewOrder(${o.id})">View</button></td>
    </tr>`).join('');
  }

  async function viewOrder(id) {
    document.getElementById('order-modal-body').innerHTML = '<div style="text-align:center;padding:30px"><div class="spinner"></div></div>';
    document.getElementById('order-modal-footer').innerHTML = '';
    openModal('order-modal');

    const res = await api.getOrder(id);
    const o   = res?.data;
    if (!o) { document.getElementById('order-modal-body').innerHTML = '<p style="color:var(--danger)">Failed to load order.</p>'; return; }

    document.getElementById('order-modal-title').textContent = `Order ${o.order_number}`;
    document.getElementById('order-modal-sub').textContent   = `Placed ${fmt.datetime(o.created_at)}`;

    const items = o.items || [];
    document.getElementById('order-modal-body').innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">
        <div>
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--gray-500);margin-bottom:10px">Customer Info</div>
          <div style="font-size:14px;line-height:1.8">
            <div><strong>${o.customer_name}</strong></div>
            <div style="color:var(--gray-500)">${o.customer_phone}</div>
            ${o.customer_email ? `<div style="color:var(--gray-500)">${o.customer_email}</div>` : ''}
            <div style="color:var(--gray-500);margin-top:4px">${o.customer_address}</div>
          </div>
        </div>
        <div>
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--gray-500);margin-bottom:10px">Payment Info</div>
          <div style="font-size:14px;line-height:2">
            <div>Method: <strong>${(o.payment_method || 'cod').toUpperCase()}</strong></div>
            <div>Status: ${fmt.statusBadge(o.payment_status)}</div>
            <div>Total: <strong style="color:var(--primary)">${fmt.currency(o.total_amount)}</strong></div>
            ${o.amount_tendered ? `<div>Tendered: ${fmt.currency(o.amount_tendered)}</div>` : ''}
            ${o.change_amount != null ? `<div>Change: ${fmt.currency(o.change_amount)}</div>` : ''}
          </div>
        </div>
      </div>
      <hr class="divider" />
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--gray-500);margin-bottom:10px">Order Items</div>
      <table class="table" style="margin-bottom:16px">
        <thead><tr><th>Product</th><th>Code</th><th>Price</th><th>Qty</th><th>Subtotal</th></tr></thead>
        <tbody>${items.map(it => `<tr>
          <td><strong>${it.product_name}</strong>${it.selected_options ? `<div style="font-size:12px;color:var(--gray-400)">${JSON.stringify(it.selected_options)}</div>` : ''}</td>
          <td><span class="code">${it.product_code}</span></td>
          <td>${fmt.currency(it.price)}</td>
          <td>${it.quantity}</td>
          <td style="font-weight:700">${fmt.currency(it.subtotal)}</td>
        </tr>`).join('')}</tbody>
      </table>
      ${o.notes ? `<div style="background:var(--gray-50);border-radius:8px;padding:12px 16px;font-size:13px;color:var(--gray-600)"><strong>Notes:</strong> ${o.notes}</div>` : ''}

      <hr class="divider" />
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px">
        <div>
          <label class="form-label">Update Order Status</label>
          <select class="form-control form-control-sm" id="update-status-sel">
            ${['pending','confirmed','processing','shipped','delivered','cancelled'].map(s =>
              `<option value="${s}" ${o.status === s ? 'selected' : ''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="form-label">Update Payment Status</label>
          <select class="form-control form-control-sm" id="update-payment-sel">
            ${['unpaid','paid','partial'].map(s =>
              `<option value="${s}" ${o.payment_status === s ? 'selected' : ''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('')}
          </select>
        </div>
      </div>
    `;
    document.getElementById('order-modal-footer').innerHTML = `
      <button class="btn btn-outline" onclick="closeModal('order-modal')">Close</button>
      <button class="btn btn-warning" onclick="updateOrderStatus(${id})">Update Status</button>
      <button class="btn btn-success" onclick="updatePaymentStatus(${id})">Update Payment</button>
    `;
  }

  async function updateOrderStatus(id) {
    const status = document.getElementById('update-status-sel').value;
    const res = await api.updateOrderStatus(id, status);
    if (res?.success) { showToast('Order status updated', 'success'); loadOrders(); closeModal('order-modal'); }
    else showToast(res?.message || 'Update failed', 'error');
  }

  async function updatePaymentStatus(id) {
    const payment_status = document.getElementById('update-payment-sel').value;
    const res = await api.updatePayment(id, { payment_status });
    if (res?.success) { showToast('Payment status updated', 'success'); loadOrders(); closeModal('order-modal'); }
    else showToast(res?.message || 'Update failed', 'error');
  }

  initCurrencyToggle(loadOrders);
  loadOrders();
</script>
</body>
</html>
