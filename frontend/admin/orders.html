<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/variables.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">📺</div>
      <div class="logo-text">FB Live<br /><span>Product System</span></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-title">Main</div>
      <a class="nav-item" href="/admin/dashboard.html"><span class="nav-icon">📊</span><span class="nav-label">Dashboard</span></a>
      <a class="nav-item" href="/admin/products.html"><span class="nav-icon">📦</span><span class="nav-label">Products</span></a>
      <a class="nav-item" href="/admin/categories.html"><span class="nav-icon">🏷️</span><span class="nav-label">Categories</span></a>
      <a class="nav-item active" href="/admin/orders.html"><span class="nav-icon">🛒</span><span class="nav-label">Orders</span></a>
      <div class="nav-section-title" style="margin-top:8px">Management</div>
      <a class="nav-item" href="/admin/users.html"><span class="nav-icon">👥</span><span class="nav-label">Users</span></a>
      <div class="nav-section-title" style="margin-top:8px">Live</div>
      <a class="nav-item" href="/cashier/live.html"><span class="nav-icon">🔴</span><span class="nav-label">Live Control</span></a>
      <a class="nav-item" href="/overlay/index.html" target="_blank"><span class="nav-icon">🖥️</span><span class="nav-label">OBS Overlay</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar" id="user-avatar">A</div>
        <div class="user-info">
          <div class="user-name" id="user-name">Admin</div>
          <div class="user-role">admin</div>
        </div>
        <button class="user-logout-btn" onclick="logout()">🚪</button>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">Orders</div>
      <div class="topbar-actions">
        <span id="order-count" style="font-size:13px;color:var(--gray-500)"></span>
      </div>
    </header>

    <div class="page-content">
      <div class="card">
        <div class="card-header">
          <div class="filter-bar" style="flex:1;margin-bottom:0;flex-wrap:wrap">
            <div class="search-input-wrapper" style="min-width:180px">
              <span class="search-icon">🔍</span>
              <input class="form-control" type="text" id="search-input" placeholder="Order #, customer, phone…" oninput="debounceLoad()" />
            </div>
            <select class="form-control" id="filter-status" onchange="loadOrders()" style="width:150px">
              <option value="">All Status</option>
              <option value="pending">Pending</option>
              <option value="confirmed">Confirmed</option>
              <option value="processing">Processing</option>
              <option value="shipped">Shipped</option>
              <option value="delivered">Delivered</option>
              <option value="cancelled">Cancelled</option>
            </select>
            <select class="form-control" id="filter-payment" onchange="loadOrders()" style="width:150px">
              <option value="">All Payments</option>
              <option value="paid">Paid</option>
              <option value="unpaid">Unpaid</option>
              <option value="partial">Partial</option>
            </select>
          </div>
        </div>
        <div class="table-wrapper">
          <table class="table">
            <thead><tr>
              <th>Order #</th><th>Customer</th><th>Phone</th><th>Total</th>
              <th>Payment</th><th>Status</th><th>Date</th><th style="width:80px">Actions</th>
            </tr></thead>
            <tbody id="orders-body">
              <tr><td colspan="8" style="text-align:center;padding:40px"><div class="spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Order Detail Modal -->
<div class="modal-backdrop" id="order-modal">
  <div class="modal modal-xl">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="order-modal-title">Order Detail</div>
        <div style="font-size:13px;color:var(--gray-500)" id="order-modal-sub"></div>
      </div>
      <button class="modal-close" onclick="closeModal('order-modal')">✕</button>
    </div>
    <div class="modal-body" id="order-modal-body">Loading…</div>
    <div class="modal-footer" id="order-modal-footer"></div>
<!-- Product Detail Modal for Admin -->
<div class="modal-backdrop" id="product-detail-modal" style="z-index:1100">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="pdm-title">Product Details</div>
        <div style="font-size:13px;color:var(--gray-500)" id="pdm-code"></div>
      </div>
      <button class="modal-close" onclick="closeModal('product-detail-modal')">✕</button>
    </div>
    <div class="modal-body" id="pdm-body">Loading…</div>
    <div class="modal-footer" id="pdm-footer">
      <button class="btn btn-outline" onclick="closeModal('product-detail-modal')">Close</button>
      <a class="btn btn-primary" id="pdm-edit-btn" href="#" target="_blank">✏️ Edit in Products</a>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/assets/js/api.js"></script>
<script>
  if (!auth.requireAuth(['admin'])) {}
  const user = auth.getUser();
  if (user) {
    document.getElementById('user-name').textContent = user.full_name || user.username;
    document.getElementById('user-avatar').textContent = (user.full_name || user.username)[0].toUpperCase();
  }
  function logout() { auth.clear(); window.location.href = '/login.html'; }

  let searchTimer = null;
  function debounceLoad() { clearTimeout(searchTimer); searchTimer = setTimeout(loadOrders, 400); }

  async function loadOrders() {
    const search  = document.getElementById('search-input').value.trim();
    const status  = document.getElementById('filter-status').value;
    const payment = document.getElementById('filter-payment').value;
    let params = '?';
    if (search)  params += `search=${encodeURIComponent(search)}&`;
    if (status)  params += `status=${status}&`;
    if (payment) params += `payment_status=${payment}&`;

    const res = await api.getOrders(params);
    const orders = res?.data || [];
    document.getElementById('order-count').textContent = `${orders.length} order${orders.length !== 1 ? 's' : ''}`;

    const body = document.getElementById('orders-body');
    if (orders.length === 0) {
      body.innerHTML = `<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">🛒</div><h3>No orders found</h3></div></td></tr>`;
      return;
    }
    body.innerHTML = orders.map(o => `<tr>
      <td><span class="code" style="font-size:11px">${o.order_number}</span></td>
      <td><strong>${o.customer_name}</strong></td>
      <td style="font-size:13px">${o.customer_phone}</td>
      <td style="font-weight:700">${fmt.currency(o.total_amount)}</td>
      <td>${fmt.statusBadge(o.payment_status)}</td>
      <td>${fmt.statusBadge(o.status)}</td>
      <td style="font-size:13px;color:var(--gray-500)">${fmt.datetime(o.created_at)}</td>
      <td><button class="btn btn-outline btn-sm" onclick="viewOrder(${o.id})">View</button></td>
    </tr>`).join('');
  }

  async function viewOrder(id) {
    document.getElementById('order-modal-body').innerHTML = '<div style="text-align:center;padding:30px"><div class="spinner"></div></div>';
    document.getElementById('order-modal-footer').innerHTML = '';
    openModal('order-modal');

    const res = await api.getOrder(id);
    const o   = res?.data;
    if (!o) { document.getElementById('order-modal-body').innerHTML = '<p style="color:var(--danger)">Failed to load order.</p>'; return; }

    document.getElementById('order-modal-title').textContent = `Order ${o.order_number}`;
    document.getElementById('order-modal-sub').textContent   = `Placed ${fmt.datetime(o.created_at)}`;

    const items = o.items || [];
    document.getElementById('order-modal-body').innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">
        <div>
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--gray-500);margin-bottom:10px">Customer Info</div>
          <div style="font-size:14px;line-height:1.8">
            <div><strong>${o.customer_name}</strong></div>
            <div style="color:var(--gray-500)">${o.customer_phone}</div>
            ${o.customer_email ? `<div style="color:var(--gray-500)">${o.customer_email}</div>` : ''}
            <div style="color:var(--gray-500);margin-top:4px">${o.customer_address}</div>
          </div>

          <!-- Customer Login Credentials -->
          <div style="margin-top:14px;background:rgba(37,99,235,0.08);border:1.5px solid rgba(37,99,235,0.25);border-radius:12px;padding:12px 14px">
            <div style="font-size:11px;font-weight:800;color:var(--primary);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between">
              <span>🔐 Customer Login (For Order Tracking)</span>
              <span style="font-size:10px;background:rgba(16,185,129,0.15);color:#10b981;padding:1px 6px;border-radius:6px;border:1px solid rgba(16,185,129,0.3);font-weight:700">Active</span>
            </div>
            <div style="font-size:13px;line-height:1.8">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <span>👤 <strong>Username:</strong></span>
                <code style="font-size:13px;font-weight:700;background:var(--gray-100);padding:2px 8px;border-radius:4px" id="modal-cust-user">${o.customer_phone || o.account_username || 'N/A'}</code>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
                <span>🔑 <strong>6-Digit PIN:</strong></span>
                <code style="font-size:15px;font-weight:900;background:#dbeafe;color:#1d4ed8;padding:3px 10px;border-radius:6px;letter-spacing:1px" id="modal-cust-pin">${o.customer_pin || '---'}</code>
              </div>
            </div>
            <div style="display:flex;gap:6px;margin-top:10px">
              <button type="button" class="btn btn-primary btn-sm" onclick="copyCustomerCreds('${o.customer_phone || o.account_username}','${o.customer_pin || ''}','${o.order_number}')" style="flex:1;font-size:12px;padding:6px 10px;display:flex;align-items:center;justify-content:center;gap:4px">
                📋 Copy Login for Customer
              </button>
              <button type="button" class="btn btn-outline btn-sm" onclick="resetCustomerPin(${o.id},'${o.order_number}')" style="font-size:12px;padding:6px 10px" title="Generate fresh 6-digit PIN if customer forgot">
                🔄 Reset PIN
              </button>
            </div>
          </div>
        </div>
        <div>
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--gray-500);margin-bottom:10px">Payment Info</div>
          <div style="font-size:14px;line-height:2">
            <div>Method: <strong>${(o.payment_method || 'cod').toUpperCase()}</strong></div>
            <div>Status: ${fmt.statusBadge(o.payment_status)}</div>
            <div>Total: <strong style="color:var(--primary)">${fmt.currency(o.total_amount)}</strong></div>
            ${o.amount_tendered ? `<div>Tendered: ${fmt.currency(o.amount_tendered)}</div>` : ''}
            ${o.change_amount != null ? `<div>Change: ${fmt.currency(o.change_amount)}</div>` : ''}
          </div>
        </div>
      </div>
      <hr class="divider" />
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--gray-500);margin-bottom:10px">Order Items</div>
      <table class="table" style="margin-bottom:16px">
        <thead><tr><th style="width:46px">Image</th><th>Product Name</th><th>Code</th><th>Price</th><th>Qty</th><th>Subtotal</th><th style="width:70px">Action</th></tr></thead>
        <tbody>${items.map(it => `<tr>
          <td>
            <div style="width:40px;height:40px;border-radius:8px;background:var(--gray-100);overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid var(--gray-200);cursor:pointer" onclick="viewProductDetail(${it.product_id || 0}, '${encodeURIComponent(JSON.stringify(it))}')" title="Click to view product details">
              ${it.product_image ? `<img src="${it.product_image}" style="width:100%;height:100%;object-fit:cover" alt="${it.product_name}" />` : `<span style="font-size:18px">📦</span>`}
            </div>
          </td>
          <td>
            <a href="javascript:void(0)" onclick="viewProductDetail(${it.product_id || 0}, '${encodeURIComponent(JSON.stringify(it))}')" style="font-weight:700;color:var(--primary);text-decoration:none">
              ${it.product_name}
            </a>
            ${it.selected_options ? `<div style="font-size:12px;color:var(--gray-400)">${typeof it.selected_options === 'string' ? it.selected_options : JSON.stringify(it.selected_options)}</div>` : ''}
          </td>
          <td><span class="code">${it.product_code}</span></td>
          <td>${fmt.currency(it.price)}</td>
          <td>${it.quantity}</td>
          <td style="font-weight:700">${fmt.currency(it.subtotal)}</td>
          <td>
            <button type="button" class="btn btn-outline btn-sm" onclick="viewProductDetail(${it.product_id || 0}, '${encodeURIComponent(JSON.stringify(it))}')" style="font-size:11px;padding:3px 8px">
              🔍 Detail
            </button>
          </td>
        </tr>`).join('')}</tbody>
      </table>
      ${o.notes ? `<div style="background:var(--gray-50);border-radius:8px;padding:12px 16px;font-size:13px;color:var(--gray-600)"><strong>Notes:</strong> ${o.notes}</div>` : ''}

      <hr class="divider" />
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px">
        <div>
          <label class="form-label" style="font-weight:700">Update Order Status</label>
          <select class="form-control form-control-sm" id="update-status-sel" style="font-weight:700">
            ${[
              { val: 'pending', label: '⏳ 1. Pending Confirmation' },
              { val: 'confirmed', label: '📋 2. Confirmed by Shop' },
              { val: 'processing', label: '📦 3. Processing & Packed' },
              { val: 'shipped', label: '🚚 4. Out for Delivery (Shipped)' },
              { val: 'delivered', label: '✅ 5. Delivered / Completed' },
              { val: 'cancelled', label: '❌ Cancelled' },
            ].map(s =>
              `<option value="${s.val}" ${o.status === s.val || (s.val === 'shipped' && o.status === 'shipping') || (s.val === 'delivered' && o.status === 'completed') ? 'selected' : ''}>${s.label}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="form-label">Update Payment Status</label>
          <select class="form-control form-control-sm" id="update-payment-sel">
            ${['unpaid','paid','partial'].map(s =>
              `<option value="${s}" ${o.payment_status === s ? 'selected' : ''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('')}
          </select>
        </div>
      </div>
    `;
    document.getElementById('order-modal-footer').innerHTML = `
      <button class="btn btn-outline" onclick="closeModal('order-modal')">Close</button>
      <button class="btn btn-warning" onclick="updateOrderStatus(${id})">Update Status</button>
      <button class="btn btn-success" onclick="updatePaymentStatus(${id})">Update Payment</button>
    `;
  }

  async function viewProductDetail(productId, encodedItem) {
    let item = null;
    try {
      if (encodedItem) item = JSON.parse(decodeURIComponent(encodedItem));
    } catch(e) {}

    openModal('product-detail-modal');
    document.getElementById('pdm-title').textContent = item?.product_name || 'Product Details';
    document.getElementById('pdm-code').textContent = item?.product_code ? `Code: ${item.product_code}` : '';
    document.getElementById('pdm-body').innerHTML = '<div style="text-align:center;padding:30px"><div class="spinner"></div></div>';

    if (productId) {
      document.getElementById('pdm-edit-btn').href = `/admin/products.html`;
      document.getElementById('pdm-edit-btn').style.display = 'inline-flex';
    } else {
      document.getElementById('pdm-edit-btn').style.display = 'none';
    }

    let p = null;
    if (productId) {
      const res = await api.getProduct(productId);
      p = res?.data;
    }

    if (!p) {
      p = {
        name: item?.product_name || 'Product',
        product_code: item?.product_code || 'N/A',
        price: item?.price || 0,
        image: item?.product_image || null,
        description: item?.product_description || 'No detailed description available.',
        stock: item?.product_stock != null ? item.product_stock : 'N/A',
        category_name: item?.category_name || 'General',
        status: 'active'
      };
    }

    let images = [];
    if (p.image) images.push(p.image);
    if (p.images) {
      try {
        const sub = typeof p.images === 'string' ? JSON.parse(p.images) : p.images;
        if (Array.isArray(sub)) {
          sub.forEach(img => { if (img && !images.includes(img)) images.push(img); });
        }
      } catch(e) {}
    }

    const galleryHtml = images.length > 0 ? `
      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="width:100%;height:220px;border-radius:12px;background:var(--gray-100);overflow:hidden;border:1px solid var(--gray-200);display:flex;align-items:center;justify-content:center">
          <img id="pdm-main-img" src="${images[0]}" style="width:100%;height:100%;object-fit:contain" alt="${p.name}" />
        </div>
        ${images.length > 1 ? `
          <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px">
            ${images.map((img, idx) => `
              <img src="${img}" style="width:50px;height:50px;object-fit:cover;border-radius:8px;border:2px solid ${idx===0?'var(--primary)':'var(--gray-200)'};cursor:pointer;flex-shrink:0" onclick="document.getElementById('pdm-main-img').src='${img}';this.parentElement.querySelectorAll('img').forEach(i=>i.style.borderColor='var(--gray-200)');this.style.borderColor='var(--primary)'" />
            `).join('')}
          </div>
        ` : ''}
      </div>
    ` : `
      <div style="width:100%;height:180px;border-radius:12px;background:var(--gray-100);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--gray-400);border:1px solid var(--gray-200)">
        <span style="font-size:42px">📦</span>
        <span style="font-size:12px;margin-top:6px">No Product Image</span>
      </div>
    `;

    document.getElementById('pdm-body').innerHTML = `
      <div style="display:grid;grid-template-columns:220px 1fr;gap:20px">
        <div>${galleryHtml}</div>
        <div style="display:flex;flex-direction:column;gap:12px">
          <div>
            <div style="font-size:18px;font-weight:800;color:var(--gray-900)">${p.name}</div>
            <div style="display:flex;align-items:center;gap:8px;margin-top:4px">
              <span class="code" style="font-size:12px">${p.product_code}</span>
              ${p.category_name ? `<span style="font-size:12px;background:var(--gray-100);color:var(--gray-600);padding:2px 8px;border-radius:6px">${p.category_name}</span>` : ''}
              ${fmt.statusBadge(p.status || 'active')}
            </div>
          </div>

          <div style="background:var(--gray-50);border:1px solid var(--gray-200);border-radius:10px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <div>
              <div style="font-size:11px;color:var(--gray-500);font-weight:600">UNIT PRICE</div>
              <div style="font-size:18px;font-weight:900;color:var(--primary)">${fmt.currency(p.price)}</div>
            </div>
            <div>
              <div style="font-size:11px;color:var(--gray-500);font-weight:600">CURRENT STOCK</div>
              <div style="font-size:18px;font-weight:900;color:${Number(p.stock) > 0 ? '#10b981' : '#ef4444'}">${p.stock != null ? p.stock : 'N/A'} units</div>
            </div>
          </div>

          ${p.description ? `
            <div>
              <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--gray-500);margin-bottom:4px">Description</div>
              <div style="font-size:13px;color:var(--gray-700);line-height:1.6;background:#fff;border:1px solid var(--gray-100);border-radius:8px;padding:10px;max-height:100px;overflow-y:auto">
                ${p.description}
              </div>
            </div>
          ` : ''}

          ${item?.selected_options ? `
            <div>
              <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--gray-500);margin-bottom:4px">Ordered Options</div>
              <div style="font-size:13px;color:var(--primary);font-weight:600;background:rgba(37,99,235,0.06);border:1px solid rgba(37,99,235,0.2);border-radius:8px;padding:8px 12px">
                ${typeof item.selected_options === 'string' ? item.selected_options : JSON.stringify(item.selected_options)}
              </div>
            </div>
          ` : ''}
        </div>
      </div>
    `;
  }

  async function updateOrderStatus(id) {
    const status = document.getElementById('update-status-sel').value;
    const res = await api.updateOrderStatus(id, status);
    if (res?.success) { showToast('Order status updated', 'success'); loadOrders(); closeModal('order-modal'); }
    else showToast(res?.message || 'Update failed', 'error');
  }

  async function updatePaymentStatus(id) {
    const payment_status = document.getElementById('update-payment-sel').value;
    const res = await api.updatePayment(id, { payment_status });
    if (res?.success) { showToast('Payment status updated', 'success'); loadOrders(); closeModal('order-modal'); }
    else showToast(res?.message || 'Update failed', 'error');
  }

  async function copyCustomerCreds(user, pin, orderNum) {
    const activePin = document.getElementById('modal-cust-pin')?.textContent?.trim() || pin;
    const activeUser = document.getElementById('modal-cust-user')?.textContent?.trim() || user;
    const trackingLink = `${window.location.origin}/customer/track.html?order=${encodeURIComponent(orderNum || '')}`;
    const text = `🛍️ Shop Login Info:\n👤 Username: ${activeUser}\n🔑 6-Digit PIN: ${activePin}\n🔗 Track Order: ${trackingLink}`;
    try {
      await navigator.clipboard.writeText(text);
      showToast('📋 Login info copied! Ready to send to customer.', 'success');
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      showToast('📋 Login info copied! Ready to send to customer.', 'success');
    }
  }

  async function resetCustomerPin(orderId, orderNum) {
    if (!confirm('Generate a new 6-digit PIN for this customer?')) return;
    try {
      const res = await api.post(`/orders/${orderId}/reset-pin`);
      if (res?.success && res.pin) {
        document.getElementById('modal-cust-pin').textContent = res.pin;
        showToast('✅ New PIN generated: ' + res.pin, 'success');
      } else {
        showToast(res?.message || 'Failed to reset PIN', 'error');
      }
    } catch(e) {
      showToast('Error resetting PIN', 'error');
    }
  }

  initCurrencyToggle(loadOrders);
  loadOrders();
</script>
</body>
</html>
