<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Product Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="/public/qr-code-styling.js"></script>
  <style>
    :root {
      --bg:          #070b14;
      --bg-surface:  #0d1424;
      --card:        rgba(17, 26, 46, 0.75);
      --card-solid:  #101a2e;
      --card2:       rgba(24, 36, 64, 0.6);
      --border:      rgba(255, 255, 255, 0.08);
      --border2:     rgba(255, 255, 255, 0.14);
      --border-focus:rgba(59, 130, 246, 0.6);
      --primary:     #3b82f6;
      --primary-d:   #2563eb;
      --primary-glow:rgba(59, 130, 246, 0.35);
      --accent:      #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.3);
      --green:       #10b981;
      --green-bg:    rgba(16, 185, 129, 0.15);
      --green-border:rgba(16, 185, 129, 0.3);
      --red:         #ef4444;
      --red-bg:      rgba(239, 68, 68, 0.15);
      --yellow:      #f59e0b;
      --yellow-bg:   rgba(245, 158, 11, 0.15);
      --text:        #f8fafc;
      --text-muted:  #94a3b8;
      --text-dim:    #64748b;
      --font:        'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --radius:      24px;
      --radius-sm:   16px;
      --radius-xs:   10px;
      --shadow-xl:   0 24px 60px rgba(0, 0, 0, 0.6);
      --shadow-glow: 0 0 40px rgba(59, 130, 246, 0.15);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: contain;
      line-height: 1.5;
    }

    body::before {
      content: '';
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.12) 0%, rgba(139, 92, 246, 0.05) 50%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      gap: 18px;
      padding: 32px;
      position: relative;
      z-index: 1;
    }
    .loader-ring {
      width: 56px; height: 56px;
      border: 4px solid rgba(255,255,255,.08);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      box-shadow: 0 0 24px var(--primary-glow);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text { font-size: 14px; font-weight: 600; color: var(--text-muted); letter-spacing: .02em; }

    .page-wrap {
      max-width: 500px;
      margin: 0 auto;
      padding-bottom: calc(100px + env(safe-area-inset-bottom, 0));
      position: relative;
      z-index: 1;
    }

    .top-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: rgba(7, 11, 20, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.25s ease;
    }
    .nav-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border2);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
    }
    .nav-btn:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.15); }
    .nav-brand {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-brand span { color: var(--primary); }

    /* Language Switcher */
    .lang-switch-group {
      display: flex;
      align-items: center;
      gap: 3px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border2);
      border-radius: 20px;
      padding: 2px 3px;
    }
    .lang-pill {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font);
      padding: 4px 8px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lang-pill.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 8px var(--primary-glow);
    }

    .hero-container {
      position: relative;
      width: 100%;
      background: #090e1a;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .hero-slider {
      display: flex;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: 440px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      cursor: grab;
      touch-action: pan-y pinch-zoom;
    }
    .hero-slider::-webkit-scrollbar { display: none; }
    .hero-slider:active { cursor: grabbing; }
    .hero-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: center;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      background: #070c18;
    }
    .hero-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
    .hero-empty {
      font-size: 96px;
      opacity: .25;
    }

    .hero-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom,
        rgba(0,0,0,0.3) 0%,
        rgba(0,0,0,0) 40%,
        rgba(7, 11, 20, 0.9) 100%);
      pointer-events: none;
    }

    .live-ribbon {
      position: absolute;
      top: 16px; left: 16px;
      z-index: 10;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 6px 13px;
      border-radius: 20px;
      display: none;
      align-items: center;
      gap: 7px;
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.55);
      backdrop-filter: blur(8px);
    }
    .live-ribbon.show { display: flex; }
    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #fff;
      animation: blink 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes blink { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:0.2; transform:scale(0.8)} }

    .stock-badge {
      position: absolute;
      top: 16px; right: 16px;
      z-index: 10;
      font-size: 11px;
      font-weight: 800;
      padding: 6px 13px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 12px rgba(0,0,0,.3);
    }
    .stock-in  { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.35); }
    .stock-low { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.35); }
    .stock-out { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.35); }

    .slider-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(10, 15, 28, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      backdrop-filter: blur(8px);
      transition: all 0.2s;
      opacity: 0.85;
    }
    .slider-arrow:hover { background: rgba(59, 130, 246, 0.8); opacity: 1; border-color: var(--primary); }
    .slider-arrow:active { transform: translateY(-50%) scale(0.9); }
    .slider-arrow.prev { left: 12px; }
    .slider-arrow.next { right: 12px; }

    .hero-footer-overlay {
      position: absolute;
      bottom: 14px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }
    .slider-dots {
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: all;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }
    .dot.active {
      width: 22px;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 0 10px rgba(255,255,255,0.7);
    }
    .slide-counter {
      background: rgba(7, 11, 20, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 14px;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .gallery-wrap {
      padding: 14px 18px 0;
    }
    .gallery-strip {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .gallery-strip::-webkit-scrollbar { display: none; }
    .gallery-thumb {
      flex-shrink: 0;
      width: 68px;
      height: 68px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 2px solid var(--border);
      cursor: pointer;
      scroll-snap-align: start;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      background: var(--card-solid);
      position: relative;
    }
    .gallery-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .gallery-thumb:hover img { transform: scale(1.06); }
    .gallery-thumb.active {
      border-color: var(--primary);
      box-shadow: 0 0 16px var(--primary-glow);
      transform: translateY(-2px);
    }
    .gallery-thumb.active::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 2px solid var(--primary);
      border-radius: inherit;
      pointer-events: none;
    }

    .content-body {
      padding: 20px 18px 0;
    }

    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .category-chip {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(139, 92, 246, 0.15) 100%);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #60a5fa;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: .08em;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .code-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: monospace;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      letter-spacing: .05em;
    }

    .prod-name {
      font-size: 24px;
      font-weight: 900;
      color: var(--text);
      line-height: 1.25;
      letter-spacing: -.02em;
      margin-bottom: 16px;
      word-break: break-word;
    }

    .price-card {
      background: linear-gradient(135deg, rgba(16, 26, 46, 0.85) 0%, rgba(24, 36, 64, 0.6) 100%);
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    .price-card::after {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 120px; height: 100%;
      background: radial-gradient(circle at right, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .price-main {
      font-size: 34px;
      font-weight: 900;
      color: var(--green);
      letter-spacing: -1.5px;
      line-height: 1;
      text-shadow: 0 2px 14px rgba(16, 185, 129, 0.3);
    }
    .price-sub {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 5px;
    }
    .currency-pill {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 8px 14px;
      border-radius: 24px;
      border: 1.5px solid var(--primary);
      background: rgba(59, 130, 246, 0.15);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      font-family: var(--font);
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
      user-select: none;
      box-shadow: 0 4px 12px var(--primary-glow);
    }
    .currency-pill:active { transform: scale(0.95); }

    .trust-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 22px;
    }
    .trust-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 8px;
      text-align: center;
    }
    .trust-icon { font-size: 18px; margin-bottom: 3px; display: block; }
    .trust-text { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }

    .options-block {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 22px;
      backdrop-filter: blur(12px);
    }
    .opt-group {
      margin-bottom: 16px;
    }
    .opt-group:last-child { margin-bottom: 0; }
    .opt-group-label {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .opt-selected-val {
      font-size: 12px;
      font-weight: 700;
      color: #60a5fa;
      background: rgba(59, 130, 246, 0.12);
      padding: 2px 10px;
      border-radius: 12px;
      text-transform: none;
      letter-spacing: 0;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 8px 18px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid var(--border2);
      color: var(--text-muted);
      cursor: pointer;
      transition: all .2s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .chip:hover { border-color: rgba(255, 255, 255, 0.3); color: #fff; }
    .chip.active {
      background: rgba(59, 130, 246, 0.2);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 0 14px var(--primary-glow);
    }
    .color-chip {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 3px solid var(--border2);
      cursor: pointer;
      transition: all .2s;
      position: relative;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .color-chip::after {
      content: '✓';
      font-size: 15px;
      font-weight: 900;
      color: #fff;
      opacity: 0;
      text-shadow: 0 1px 3px rgba(0,0,0,.9);
      transition: opacity .15s;
    }
    .color-chip.active {
      border-color: #fff;
      transform: scale(1.08);
      box-shadow: 0 0 0 2px var(--primary), 0 6px 16px var(--primary-glow);
    }
    .color-chip.active::after { opacity: 1; }

    .description-block {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 22px;
    }
    .section-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 8px;
    }
    .description-text {
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.7;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 6px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border2);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--font);
      transition: all .2s;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .action-btn .ab-icon { font-size: 18px; line-height: 1; }
    .action-btn:hover { background: rgba(255, 255, 255, 0.08); color: #fff; border-color: rgba(255, 255, 255, 0.25); }
    .action-btn.saved { background: var(--green-bg); border-color: var(--green); color: var(--green); }

    .sticky-checkout {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 80;
      background: rgba(7, 11, 20, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0));
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.6);
    }
    .sticky-inner {
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .sticky-price-wrap {
      flex: 1;
      min-width: 0;
    }
    .sticky-price-label {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-dim);
    }
    .sticky-price-main {
      font-size: 22px;
      font-weight: 900;
      color: var(--green);
      line-height: 1.1;
      letter-spacing: -0.5px;
    }
    .buy-btn {
      flex: 2;
      padding: 16px 22px;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 16px;
      font-weight: 800;
      font-family: var(--font);
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(59, 130, 246, 0.45);
      transition: all .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }
    .buy-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(59, 130, 246, 0.6); }
    .buy-btn:active { transform: translateY(0); }
    .buy-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }

    .brand-footer {
      margin-top: 10px;
      font-size: 11px;
      color: var(--text-dim);
      text-align: center;
      letter-spacing: .03em;
    }
    .brand-footer span { color: var(--primary); font-weight: 700; }

    #toast {
      position: fixed;
      bottom: calc(90px + env(safe-area-inset-bottom, 0));
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid var(--border2);
      color: #fff;
      padding: 12px 22px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      opacity: 0;
      transition: all .25s cubic-bezier(.34,1.56,.64,1);
      pointer-events: none;
      z-index: 999;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0,0,0,.6);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .share-modal-bg {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 900;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: env(safe-area-inset-bottom, 0);
      opacity: 0; pointer-events: none;
      transition: opacity .25s;
      backdrop-filter: blur(8px);
    }
    .share-modal-bg.open { opacity: 1; pointer-events: all; }
    .share-modal {
      background: var(--card-solid);
      border: 1px solid var(--border2);
      border-radius: var(--radius) var(--radius) 0 0;
      width: 100%;
      max-width: 500px;
      padding: 24px 20px 32px;
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.34,1.1,.64,1);
    }
    .share-modal-bg.open .share-modal { transform: translateY(0); }
    .share-modal-handle {
      width: 40px; height: 4px;
      background: var(--border2);
      border-radius: 2px;
      margin: 0 auto 18px;
    }
    .share-modal-title { font-size: 16px; font-weight: 800; color: #fff; text-align: center; margin-bottom: 16px; }
    .share-qr-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-bottom: 20px; }
    .share-qr-box {
      background: #fff;
      border-radius: 16px;
      padding: 12px;
      width: 180px; height: 180px;
      display: flex; align-items: center; justify-content: center;
    }
    .share-url-box {
      width: 100%;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border2);
      border-radius: var(--radius-xs);
      padding: 10px 14px;
      font-size: 11px;
      font-family: monospace;
      color: var(--text-muted);
      word-break: break-all;
      text-align: center;
    }
    .share-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .share-action-btn {
      padding: 14px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border2);
      background: rgba(255,255,255,.05);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .share-action-btn.primary { background: var(--primary); border-color: var(--primary); }

    .error-wrap {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 80svh; gap: 14px; text-align: center; padding: 32px;
    }
  </style>
</head>
<body>

  <div id="root">
    <div class="loader">
      <div class="loader-ring"></div>
      <p class="loader-text">Loading product details…</p>
    </div>
  </div>

  <div id="toast"></div>

  <div class="share-modal-bg" id="share-modal" onclick="handleShareModalClick(event)">
    <div class="share-modal">
      <div class="share-modal-handle"></div>
      <div class="share-modal-title">Share Product</div>
      <div class="share-qr-wrap">
        <div class="share-qr-box" id="share-qr-wrap"></div>
        <div class="share-url-box" id="share-url-text"></div>
      </div>
      <div class="share-actions">
        <button class="share-action-btn" onclick="copyLink()">📋 Copy Link</button>
        <button class="share-action-btn primary" onclick="nativeShare()">🚀 Share</button>
      </div>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script>
    const params      = new URLSearchParams(window.location.search);
    const productCode = (params.get('code') || params.get('id') || '').trim();
    const API         = window.location.origin + '/api';
    let product       = null;
    let saved         = false;
    let selectedOpts  = {};
    let customerUrl   = '';
    let shareQrBuilt  = false;
    let currentSlide  = 0;
    let allProductImages = [];

    let toastTimer;
    function toast(msg, dur = 2500) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), dur);
    }

    function priceMain(v) {
      return currencyMode.isKHR()
        ? '៛' + Math.round(Number(v) * KHR_RATE).toLocaleString('en-US')
        : '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function priceSub(v) {
      return currencyMode.isKHR()
        ? '≈ $' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' USD'
        : '≈ ៛' + Math.round(Number(v) * KHR_RATE).toLocaleString('en-US') + ' KHR';
    }
    function toggleCurrency() {
      currencyMode.toggle();
      refreshPriceDisplay();
    }
    function refreshPriceDisplay() {
      const pMain = document.getElementById('price-main');
      const pSub  = document.getElementById('price-sub');
      const sMain = document.getElementById('sticky-price-main');
      const btn   = document.getElementById('currency-pill');
      if (!product) return;
      const mainText = priceMain(product.price);
      const subText  = priceSub(product.price);
      if (pMain) pMain.textContent = mainText;
      if (pSub)  pSub.textContent  = subText;
      if (sMain) sMain.textContent = mainText;
      if (btn) {
        const isKHR = currencyMode.isKHR();
        btn.innerHTML = isKHR ? '<span>$</span> Switch USD' : '<span>៛</span> Switch KHR';
      }
    }

    function scrollToSlide(idx) {
      const slider = document.getElementById('hero-slider');
      if (!slider) return;
      const slides = slider.querySelectorAll('.hero-slide');
      if (idx < 0 || idx >= slides.length) return;
      currentSlide = idx;
      slides[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      updateActiveSlideUI(idx);
    }
    function slideNext() { scrollToSlide(currentSlide + 1 < allProductImages.length ? currentSlide + 1 : 0); }
    function slidePrev() { scrollToSlide(currentSlide - 1 >= 0 ? currentSlide - 1 : allProductImages.length - 1); }

    function updateActiveSlideUI(idx) {
      currentSlide = idx;
      document.querySelectorAll('.slider-dots .dot').forEach((d, i) => { d.classList.toggle('active', i === idx); });
      const counterEl = document.getElementById('slide-counter-num');
      if (counterEl) counterEl.textContent = `${idx + 1} / ${allProductImages.length}`;
      document.querySelectorAll('.gallery-thumb').forEach((t, i) => {
        t.classList.toggle('active', i === idx);
        if (i === idx) t.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      });
    }

    function onHeroScroll() {
      const slider = document.getElementById('hero-slider');
      if (!slider) return;
      const width = slider.clientWidth || 1;
      const idx = Math.round(slider.scrollLeft / width);
      if (idx !== currentSlide && idx >= 0 && idx < allProductImages.length) updateActiveSlideUI(idx);
    }

    function buildQR(containerId, url, size = 150) {
      const wrap = document.getElementById(containerId);
      if (!wrap || typeof QRCodeStyling === 'undefined') return;
      wrap.innerHTML = '';
      new QRCodeStyling({
        width:  size, height: size,
        type:   'canvas',
        data:   url,
        dotsOptions:         { color: '#090e1a', type: 'rounded' },
        cornersSquareOptions: { type: 'extra-rounded', color: '#090e1a' },
        cornersDotOptions:    { type: 'dot', color: '#3b82f6' },
        backgroundOptions:    { color: '#ffffff' },
      }).append(wrap);
    }

    function selectOption(key, val, el) {
      selectedOpts[key] = val;
      const group = el.closest('.opt-group');
      if (group) {
        group.querySelectorAll('.chip, .color-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        const label = group.querySelector('.opt-selected-val');
        if (label) label.textContent = val;
      }
      refreshCustomerUrl();
    }

    function refreshCustomerUrl() {
      const u = new URL(window.location.origin + '/customer/order.html');
      u.searchParams.set('code', product?.product_code || '');
      Object.entries(selectedOpts).forEach(([k, v]) => u.searchParams.set(`opt_${k}`, v));
      customerUrl = u.toString();
    }

    function nameToColor(name) {
      const map = {
        white:'#ffffff', black:'#0f172a', red:'#ef4444', blue:'#3b82f6',
        green:'#10b981', yellow:'#f59e0b', pink:'#ec4899', purple:'#a855f7',
        orange:'#f97316', gray:'#64748b', grey:'#64748b', navy:'#1e3a8a',
        gold:'#eab308', silver:'#cbd5e1', brown:'#78350f', beige:'#d4b896'
      };
      return map[(name || '').toLowerCase().trim()] || null;
    }

    function renderOptions(opts) {
      if (!opts || typeof opts !== 'object') return '';
      const entries = Object.entries(opts);
      if (!entries.length) return '';
      return entries.map(([key, values]) => {
        if (!Array.isArray(values) || !values.length) return '';
        const firstVal = values[0];
        selectedOpts[key] = firstVal;
        const isColor = key.toLowerCase().includes('color') || key.toLowerCase().includes('colour');
        const chipsHtml = isColor
          ? values.map((v, i) => {
              const css = nameToColor(v);
              if (css) return `<div class="color-chip ${i === 0 ? 'active' : ''}" style="background:${css}" title="${v}" onclick="selectOption('${key}','${v}',this)"></div>`;
              return `<button class="chip ${i === 0 ? 'active' : ''}" onclick="selectOption('${key}','${v}',this)">${v}</button>`;
            }).join('')
          : values.map((v, i) => `<button class="chip ${i === 0 ? 'active' : ''}" onclick="selectOption('${key}','${v}',this)">${v}</button>`).join('');
        return `
          <div class="opt-group">
            <div class="opt-group-label">
              <span>${key}</span>
              <span class="opt-selected-val">${firstVal}</span>
            </div>
            <div class="chips">${chipsHtml}</div>
          </div>`;
      }).join('');
    }

    function stockBadge(stock) {
      const lang = I18N.getLang();
      if (stock <= 0)  return { cls: 'stock-out', text: `🚫 ${I18N.t('outOfStock')}` };
      if (stock <= 10) return { cls: 'stock-low', text: `⚡ ${I18N.t('lowStock')} (${stock})` };
      return { cls: 'stock-in', text: `⚡ ${I18N.t('inStock')} (${stock})` };
    }

    function toggleSave() {
      saved = !saved;
      const btn = document.getElementById('btn-save');
      if (!btn) return;
      if (saved) {
        btn.classList.add('saved');
        btn.querySelector('.ab-icon').textContent = '❤️';
        toast('❤️ ' + I18N.t('saved'));
      } else {
        btn.classList.remove('saved');
        btn.querySelector('.ab-icon').textContent = '🤍';
        toast(I18N.t('save'));
      }
    }

    function openShareModal() {
      const modal = document.getElementById('share-modal');
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
      if (!shareQrBuilt && customerUrl) {
        requestAnimationFrame(() => {
          buildQR('share-qr-wrap', customerUrl, 150);
          document.getElementById('share-url-text').textContent = customerUrl;
          shareQrBuilt = true;
        });
      }
    }
    function closeShareModal() { document.getElementById('share-modal').classList.remove('open'); document.body.style.overflow = ''; }
    function handleShareModalClick(e) { if (e.target === document.getElementById('share-modal')) closeShareModal(); }

    async function copyLink() {
      try { await navigator.clipboard.writeText(customerUrl); toast('📋 ' + I18N.t('copyLink') + '!'); }
      catch {
        const ta = document.createElement('textarea');
        ta.value = customerUrl; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
        toast('📋 ' + I18N.t('copyLink') + '!');
      }
    }

    async function nativeShare() {
      if (navigator.share) {
        try { await navigator.share({ title: product?.name, text: `${product?.name} — ${priceMain(product?.price || 0)}`, url: customerUrl }); }
        catch (e) { if (e.name !== 'AbortError') copyLink(); }
      } else copyLink();
    }

    function buyNow() { window.location.href = customerUrl; }

    /* ─── Language Translation Bot ─── */
    const translationCache = {};
    let isLiveState = false;

    async function setLanguage(lang) {
      I18N.setLang(lang);
      if (lang !== 'en' && product) {
        const cacheKey = `${lang}_${product.id}`;
        if (!translationCache[cacheKey]) {
          toast(lang === 'km' ? '🤖 កំពុងបកប្រែជាភាសាខ្មែរ...' : '🤖 正在翻译中文...', 1800);
          try {
            const res = await api.translateProduct(product.name, product.description || '');
            if (res?.success && res.data?.[lang]) {
              translationCache[cacheKey] = res.data[lang];
            }
          } catch (e) {
            console.warn('Auto-translation bot error:', e);
          }
        }
      }
      render(product, isLiveState);
    }

    function render(p, isLive) {
      isLiveState = isLive;
      const curLang = I18N.getLang();
      const translated = (curLang !== 'en' && translationCache[`${curLang}_${p.id}`]) || null;
      const displayName = translated?.name || p.name;
      const displayDesc = translated?.description || p.description;

      const sb = stockBadge(p.stock);
      allProductImages = Array.isArray(p.images) && p.images.length > 0 ? p.images.filter(Boolean) : (p.image ? [p.image] : []);
      if (allProductImages.length === 0 && p.image) allProductImages = [p.image];
      const slidesHtml = allProductImages.length > 0 ? allProductImages.map(img => `<div class="hero-slide"><img src="${fmt.imgUrl(img)}" alt="${displayName}" loading="eager" /></div>`).join('') : `<div class="hero-slide"><div class="hero-empty">📦</div></div>`;
      const hasMultiple = allProductImages.length > 1;
      const arrowsHtml = hasMultiple ? `<button class="slider-arrow prev" onclick="slidePrev()" title="Previous photo">‹</button><button class="slider-arrow next" onclick="slideNext()" title="Next photo">›</button>` : '';
      const dotsHtml = hasMultiple ? `<div class="slider-dots">${allProductImages.map((_, i) => `<div class="dot ${i === 0 ? 'active' : ''}" onclick="scrollToSlide(${i})"></div>`).join('')}</div>` : '<div></div>';
      const counterHtml = hasMultiple ? `<div class="slide-counter"><span>📸</span> <span id="slide-counter-num">1 / ${allProductImages.length}</span></div>` : '';
      const galleryHtml = hasMultiple ? `<div class="gallery-wrap"><div class="gallery-strip" id="gallery-strip">${allProductImages.map((img, idx) => `<div class="gallery-thumb ${idx === 0 ? 'active' : ''}" onclick="scrollToSlide(${idx})"><img src="${fmt.imgUrl(img)}" alt="thumb ${idx+1}" /></div>`).join('')}</div></div>` : '';
      const optsHtml = renderOptions(p.options);
      const optSection = optsHtml ? `<div class="options-block"><div class="section-title">⚙️ ${I18N.t('chooseOptions')}</div>${optsHtml}</div>` : '';
      const descHtml = displayDesc ? `<div class="description-block"><div class="section-title">📝 ${I18N.t('productDescription')}</div><div class="description-text">${escHtml(displayDesc)}</div></div>` : '';
      
      document.getElementById('root').innerHTML = `
        <div class="top-nav">
          <button class="nav-btn" onclick="history.length > 1 ? history.back() : window.location.href='/customer/product.html'" title="Back">←</button>
          
          <!-- Auto-Bot Language Selector -->
          <div class="lang-switch-group">
            <button class="lang-pill ${curLang==='en'?'active':''}" onclick="setLanguage('en')">🇺🇸 EN</button>
            <button class="lang-pill ${curLang==='km'?'active':''}" onclick="setLanguage('km')">🇰🇭 ខ្មែរ</button>
            <button class="lang-pill ${curLang==='zh'?'active':''}" onclick="setLanguage('zh')">🇨🇳 中文</button>
          </div>

          <button class="nav-btn" onclick="openShareModal()" title="Share">↗</button>
        </div>
        <div class="page-wrap">
          <div class="hero-container">
            <div class="hero-slider" id="hero-slider" onscroll="onHeroScroll()">${slidesHtml}</div>
            <div class="hero-gradient"></div>
            <div class="live-ribbon ${isLive ? 'show' : ''}" id="live-ribbon"><span class="live-dot"></span> ${I18N.t('liveNow')}</div>
            <span class="stock-badge ${sb.cls}">${sb.text}</span>
            ${arrowsHtml}
            <div class="hero-footer-overlay">${dotsHtml}${counterHtml}</div>
          </div>
          ${galleryHtml}
          <div class="content-body">
            <div class="meta-row">
              <div class="category-chip"><span>🏷️</span> ${escHtml(p.category_name || 'General')}</div>
              <div class="code-pill">Code: ${escHtml(p.product_code)}</div>
            </div>
            <h1 class="prod-name">${escHtml(displayName)}</h1>
            <div class="price-card">
              <div>
                <div class="price-main" id="price-main">${priceMain(p.price)}</div>
                <div class="price-sub" id="price-sub">${priceSub(p.price)}</div>
              </div>
              <button class="currency-pill" id="currency-pill" onclick="toggleCurrency()"><span>៛</span> Switch KHR</button>
            </div>
            <div class="trust-grid">
              <div class="trust-item"><span class="trust-icon">🚚</span><span class="trust-text">${I18N.t('fastDelivery')}</span></div>
              <div class="trust-item"><span class="trust-icon">💵</span><span class="trust-text">${I18N.t('cod')}</span></div>
              <div class="trust-item"><span class="trust-icon">🛡️</span><span class="trust-text">${I18N.t('genuineQuality')}</span></div>
            </div>
            ${optSection}
            ${descHtml}
            <div class="action-grid">
              <button class="action-btn" id="btn-save" onclick="toggleSave()"><span class="ab-icon">🤍</span>${I18N.t('save')}</button>
              <button class="action-btn" onclick="copyLink()"><span class="ab-icon">🔗</span>${I18N.t('copyLink')}</button>
              <button class="action-btn" onclick="openShareModal()"><span class="ab-icon">📱</span>${I18N.t('scanQr')}</button>
            </div>
            <div class="brand-footer">Powered by <span>FB Live Shop</span> &nbsp;·&nbsp; Scan. Shop. Done.</div>
          </div>
        </div>
        <div class="sticky-checkout">
          <div class="sticky-inner">
            <div class="sticky-price-wrap">
              <div class="sticky-price-label">${I18N.t('totalPrice')}</div>
              <div class="sticky-price-main" id="sticky-price-main">${priceMain(p.price)}</div>
            </div>
            <button class="buy-btn" id="buy-btn" ${p.stock <= 0 ? 'disabled' : ''} onclick="buyNow()">${p.stock <= 0 ? '🚫 ' + I18N.t('outOfStock') : '🛒 ' + I18N.t('orderNow')}</button>
          </div>
        </div>`;
      refreshPriceDisplay();
    }
    function escHtml(str) { return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    async function init() {
      if (!productCode) { showError('No product code.', 'Please scan a valid product QR code.'); return; }
      try {
        const [pRes, lRes] = await Promise.all([fetch(`${API}/products/${encodeURIComponent(productCode)}`).then(r => r.json()), fetch(`${API}/live/active`).then(r => r.json()).catch(() => null)]);
        if (!pRes.success || !pRes.data) { showError('Product not found.', `Code "${productCode}" could not be located.`); return; }
        product = pRes.data;
        if (typeof product.options === 'string') { try { product.options = JSON.parse(product.options); } catch { product.options = null; } }
        render(product, lRes?.data?.current_product_id != null);
        refreshCustomerUrl();
      } catch (err) { showError('Connection error.', 'Please check your internet connection.'); }
    }
    function showError(title, msg = '') {
      document.getElementById('root').innerHTML = `
        <div class="error-wrap">
          <div style="font-size:56px">📦</div>
          <h2 style="font-size:20px;font-weight:900;margin:10px 0 6px">${escHtml(title)}</h2>
          <p style="font-size:13px;color:var(--text-muted);max-width:320px">${escHtml(msg)}</p>
          <button onclick="history.back()"
            style="margin-top:16px;padding:12px 28px;border-radius:30px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);color:var(--text);font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font)">
            ← Go Back
          </button>
        </div>`;
    }

    init();
  </script>
</body>
</html>
